name: Testes offline do gerenciador de urnas

on:
  push:
    paths:
      - urnas.py
      - statistical_forensics.py
      - history_forensics.py
      - run_control.py
      - reconcile_incremental.py
      - reconcile_fast.py
      - reconcile_stream.py
      - cross_office_sections.py
      - audit_cross_office_totals.py
      - audit_cross_office_eligibility.py
      - cross_office_candidate_correlations.py
      - cross_office_senate_correlations.py
      - audit_senate_correlations.py
      - audit_cross_office_correlations.py
      - verify_noronha_6261.py
      - reconcile_probe.py
      - reconcile_io_probe.py
      - diagnose_forensics.py
      - collect_forensics.py
      - tests/test_urnas.py
      - tests/test_reconcile_incremental.py
      - tests/test_reconcile_stream.py
      - tests/test_cross_office_sections.py
      - tests/test_audit_cross_office_totals.py
      - tests/test_audit_cross_office_eligibility.py
      - tests/test_cross_office_candidate_correlations.py
      - tests/test_cross_office_senate_correlations.py
      - tests/test_audit_senate_correlations.py
      - tests/test_audit_cross_office_correlations.py
      - tests/test_verify_noronha_6261.py
      - tests/test_reconcile_io_probe.py
      - tests/test_diagnose_forensics.py
      - tests/test_statistical_forensics.py
      - tests/test_history_forensics.py
      - .github/workflows/urnas-tests.yml
  pull_request:
    paths:
      - urnas.py
      - statistical_forensics.py
      - history_forensics.py
      - run_control.py
      - reconcile_incremental.py
      - reconcile_fast.py
      - reconcile_stream.py
      - cross_office_sections.py
      - audit_cross_office_totals.py
      - audit_cross_office_eligibility.py
      - cross_office_candidate_correlations.py
      - cross_office_senate_correlations.py
      - audit_senate_correlations.py
      - audit_cross_office_correlations.py
      - verify_noronha_6261.py
      - reconcile_probe.py
      - reconcile_io_probe.py
      - diagnose_forensics.py
      - collect_forensics.py
      - tests/test_urnas.py
      - tests/test_reconcile_incremental.py
      - tests/test_reconcile_stream.py
      - tests/test_cross_office_sections.py
      - tests/test_audit_cross_office_totals.py
      - tests/test_audit_cross_office_eligibility.py
      - tests/test_cross_office_candidate_correlations.py
      - tests/test_cross_office_senate_correlations.py
      - tests/test_audit_senate_correlations.py
      - tests/test_audit_cross_office_correlations.py
      - tests/test_verify_noronha_6261.py
      - tests/test_reconcile_io_probe.py
      - tests/test_diagnose_forensics.py
      - tests/test_statistical_forensics.py
      - tests/test_history_forensics.py

jobs:
  urnas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe
        run: python -m py_compile urnas.py statistical_forensics.py history_forensics.py run_control.py collect_forensics.py reconcile_incremental.py reconcile_fast.py reconcile_stream.py reconcile_probe.py reconcile_io_probe.py diagnose_forensics.py cross_office_sections.py audit_cross_office_totals.py audit_cross_office_eligibility.py cross_office_candidate_correlations.py cross_office_senate_correlations.py audit_senate_correlations.py audit_cross_office_correlations.py verify_noronha_6261.py
      - name: Testes com arquivos sinteticos
        run: python -m unittest discover -s tests -p 'test_*.py' -v
