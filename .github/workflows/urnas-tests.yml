name: Testes offline do gerenciador de urnas

on:
  push:
    paths:
      - urnas.py
      - statistical_forensics.py
      - history_forensics.py
      - run_control.py
      - collect_forensics.py
      - tests/test_urnas.py
      - tests/test_statistical_forensics.py
      - tests/test_history_forensics.py
      - .github/workflows/urnas-tests.yml
  pull_request:
    paths:
      - urnas.py
      - statistical_forensics.py
      - history_forensics.py
      - run_control.py
      - collect_forensics.py
      - tests/test_urnas.py
      - tests/test_statistical_forensics.py
      - tests/test_history_forensics.py

jobs:
  urnas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe
        run: python -m py_compile urnas.py statistical_forensics.py history_forensics.py run_control.py collect_forensics.py
      - name: Testes com arquivos sinteticos
        run: python -m unittest discover -s tests -p 'test_*.py' -v
